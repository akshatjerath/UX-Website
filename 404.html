<!doctype html>

  <title>Page not found | Akshat Jerath</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <script>
    /* GitHub Pages shows this page at whatever address was mistyped, which can be several folders
       deep, and a relative path like styles.css would then point at the wrong place. So, first of all,
       point every relative path on this page at the site's root folder. On github.io the root is
       the first part of the address (the repository name); anywhere else it is the top. Without
       JavaScript the page still works for a one-level typo. This page has no #links on purpose:
       with a base set, "#main" would leave the page. */
    (function () {
      var p = location.pathname.split("/");
      var root = /\.github\.io$/.test(location.hostname) && p[1] ? "/" + p[1] + "/" : "/";
      var b = document.createElement("base");
      b.href = root;
      document.head.appendChild(b);
    })();
  </script>
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    document.documentElement.classList.add("js");
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>

    </div>
