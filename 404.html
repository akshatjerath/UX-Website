<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Akshat Jerath</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<script>
  /* GitHub Pages shows this page at the mistyped address, which can be folders deep.
     Point relative links at the site root: on github.io that is the repository folder. */
  (function () {
    var p = location.pathname.split("/");
    var b = document.createElement("base");
    b.href = /\.github\.io$/.test(location.hostname) && p[1] ? "/" + p[1] + "/" : "/";
    document.head.appendChild(b);
  })();
</script>
<style>
  :root{--bg:#0C0E11;--ink:#EEF1F5;--muted:#9AA3AE;--accent:#25CA7F;--accent-ink:#04140B}
  @media (prefers-color-scheme: light){:root{--bg:#F1F2F4;--ink:#11141A;--muted:#58606B;--accent:#0F7A48;--accent-ink:#fff}}
  body{margin:0;min-height:100vh;display:grid;place-content:center;gap:16px;padding:24px;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,sans-serif;text-align:center}
  h1{margin:0;font-size:clamp(48px,10vw,96px);line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
  p{margin:0;color:var(--muted)}
  a{justify-self:center;padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <h1>Not found</h1>
  <p>That page doesn't exist. The case studies are all on the home page.</p>
  <a href="index.html">Back to the work</a>
</body>
</html>
